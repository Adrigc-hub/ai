
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Breath Animation - Con Audio Sintetizado</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            font-family: monospace;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #000;
            box-shadow: 0 0 25px rgba(0, 0, 255, 0.3);
            cursor: pointer;
        }
        .instruction {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<canvas id="canvas" width="600" height="450"></canvas>
<div class="instruction">[ Haz clic en la pantalla para iniciar con música ]</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let state = 'WAITING'; // WAITING -> HEART_BEAT -> CRUSHING -> GAMEOVER
let timer = 0;
let particles = [];
let audioCtx = null;

// Sistema de Audio Web nativo para simular los sintetizadores épicos
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playTone(freq, type, duration, delay = 0) {
    if (!audioCtx) return;
    setTimeout(() => {
        try {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }, delay);
}

function playLastBreathTheme() {
    // Secuencia de notas dramáticas estilo Last Breath
    const notes = [130.81, 146.83, 164.81, 196.00, 220.00, 196.00, 164.81];
    notes.forEach((note, index) => {
        playTone(note, 'sawtooth', 0.4, index * 300);
    });
}

// Iniciar al hacer clic por políticas de los navegadores
canvas.addEventListener('click', () => {
    initAudio();
    if (state === 'WAITING') {
        state = 'HEART_BEAT';
        timer = 0;
        playLastBreathTheme();
    }
});

class Pixel {
    constructor(x, y, color, vx, vy) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = vx;
        this.vy = vy;
        this.size = 4; // Píxeles diminutos cuadrados
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.25; // Gravedad
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
    }
}

function initHeartExplosion() {
    particles = [];
    playTone(80, 'square', 0.8, 0); // Sonido de impacto grave
    for (let i = 0; i < 180; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 9 + 2;
        particles.push(new Pixel(
            300 + (Math.random() * 30 - 15),
            225 + (Math.random() * 30 - 15),
            '#0000FF',
            Math.cos(angle) * speed,
            Math.sin(angle) * speed
        ));
    }
}

function drawPixelHeart(x, y, scale = 1, color = '#0000FF') {
    ctx.fillStyle = color;
    const p = 6 * scale;
    const heartMatrix = [
        "0110110",
        "1111111",
        "1111111",
        "0111110",
        "0011100",
        "0001000"
    ];
    
    for (let row = 0; row < heartMatrix.length; row++) {
        for (let col = 0; col < heartMatrix[row].length; col++) {
            if (heartMatrix[row][col] === '1') {
                ctx.fillRect(x + col * p, y + row * p, p, p);
            }
        }
    }
}

function animate() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (state === 'WAITING') {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '20px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('HAZ CLIC PARA COMENZAR', 300, 225);
        requestAnimationFrame(animate);
        return;
    }

    timer++;

    if (state === 'HEART_BEAT') {
        // Aura blanca y corazón latiendo[span_1](start_span)[span_1](end_span)
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(300, 225, 45 + Math.sin(timer * 0.25) * 6, 0, Math.PI * 2);
        ctx.fill();

        drawPixelHeart(270, 195, 2, '#0000FF');

        if (timer > 140) {
            state = 'CRUSHING';
            timer = 0;
            initHeartExplosion();
        }
    } 
    else if (state === 'CRUSHING') {
        // Explosión de bloques cuadrados del corazón[span_2](start_span)[span_2](end_span)
        particles.forEach(p => {
            p.update();
            p.draw();
        });

        if (timer > 70) {
            state = 'GAMEOVER';
            timer = 0;
        }
    } 
    else if (state === 'GAMEOVER') {
        // Pantalla de GAME OVER, reflector y Sans[span_3](start_span)[span_3](end_span)
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', 300, 100);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.beginPath();
        ctx.moveTo(300, 120);
        ctx.lineTo(140, 410);
        ctx.ресенье;
        ctx.lineTo(460, 410);
        ctx.fill();

        // Silueta de Sans
        ctx.fillStyle = '#111';
        ctx.fillRect(270, 250, 60, 100);
        ctx.fillStyle = '#FFF';
        ctx.fillRect(285, 230, 30, 25);

        // Corazones rotos en el suelo
        drawPixelHeart(280, 370, 0.5, '#0000FF');
        drawPixelHeart(305, 375, 0.5, '#0000FF');
        drawPixelHeart(295, 385, 0.5, '#0000FF');

        // Texto secuencial de Last Breath[span_4](start_span)[span_4](end_span)
        ctx.font = '16px monospace';
        ctx.textAlign = 'left';
        if (timer > 40) ctx.fillText('if you ever', 80, 260);[span_5](start_span)[span_5](end_span)
        if (timer > 90) ctx.fillText('cared about', 80, 285);[span_6](start_span)[span_6](end_span)
        if (timer > 140) ctx.fillText('someone', 80, 310);[span_7](start_span)[span_7](end_span)

        if (timer > 190) {
            ctx.textAlign = 'right';
            ctx.fillText('you won\'t', 520, 260);[span_8](start_span)[span_8](end_span)
            ctx.fillText('come back', 520, 285);[span_9](start_span)[span_9](end_span)
        }
    }

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
