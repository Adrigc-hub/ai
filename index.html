<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Music Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Sintetizador Matemático</h1>
    <p>Generación de melodías y secuencias ritmicas usando funciones matemáticas.</p>

    <div class="controls">
      <select id="funcSelect">
        <option value="fibonacci">1. Fibonacci Mod 4 (Arpegio)</option>
        <option value="fifths">2. Círculo de Quintas (4n mod 7)</option>
        <option value="pendulum">3. Pendulum Wave (Onda armónica)</option>
      </select>
      <button id="startBtn">▶ Iniciar / Pausar</button>
    </div>

    <canvas id="visualizer" width="600" height="250"></canvas>
  </main>

  <script src="app.js"></script>
</body>
</html>
